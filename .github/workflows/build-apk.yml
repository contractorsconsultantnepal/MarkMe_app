name: Build MarkMe APK

# Builds a debug-signed release APK on every push to main, and lets you
# trigger it manually from the Actions tab. No local Flutter/Android SDK
# needed — download the finished APK from the run's "Artifacts" section.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo ships lib/ + pubspec.yaml only (no android/ios folders),
      # so generate a throwaway scaffold just to obtain a matching android/
      # folder, then copy it in without touching our existing lib/pubspec.
      - name: Generate android/ platform folder
        run: |
          flutter create --platforms=android --org com.markme --project-name markme_app /tmp/markme_scaffold
          cp -r /tmp/markme_scaffold/android ./android

      - name: Enable core library desugaring
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          app_dir = Path('android/app')
          gradle_file = next(app_dir.glob('build.gradle*'))
          content = gradle_file.read_text()

          if gradle_file.suffix == '.kts':
            content = content.replace(
              'compileOptions {',
              'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
              1,
            )
            dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
            content = content.replace(
              'compileOptions {',
              'compileOptions {\n        coreLibraryDesugaringEnabled true',
              1,
            )
            dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if 'dependencies {' in content:
            content = content.replace(
              'dependencies {',
              'dependencies {\n' + dependency,
              1,
            )
          else:
            content += '\n\ndependencies {\n' + dependency + '\n}\n'

          gradle_file.write_text(content)
          EOF

      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'EOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          )
          if 'ACCESS_FINE_LOCATION' not in content:
              content = content.replace('<application', perms + '\n    <application', 1)
          with open(path, 'w') as f:
              f.write(content)
          EOF

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: markme-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
